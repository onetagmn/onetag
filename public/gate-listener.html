<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>OneTag Gate Reader</title>
<style>
  :root {
    --blue: #0B5FFF; --blue-dark: #0847C7; --sky: #DCEEFF; --green: #32C36C;
    --amber: #F7A81B; --red: #E5484D;
    --white: #FFFFFF; --bg: #0E2338; --ink: #1E293B; --muted: #64748B; --line: #24405C;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    font-family: 'Inter', -apple-system, "Segoe UI", sans-serif;
    background: var(--bg); color: #fff;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    text-align: center; padding: 24px; overflow: hidden;
  }
  .logo { font-weight: 800; font-size: 20px; letter-spacing: 0.02em; opacity: 0.85; margin-bottom: 6px; }
  .status-banner {
    width: 100%; max-width: 560px; border-radius: 16px; padding: 18px 20px;
    font-size: 16px; font-weight: 700; margin-bottom: 22px; transition: background 0.3s ease, color 0.3s ease;
    display: flex; align-items: center; justify-content: center; gap: 10px;
  }
  .status-banner.online { background: rgba(50,195,108,0.15); color: var(--green); border: 1.5px solid rgba(50,195,108,0.35); }
  .status-banner.offline { background: rgba(247,168,27,0.15); color: var(--amber); border: 1.5px solid rgba(247,168,27,0.35); }
  .dot { width: 9px; height: 9px; border-radius: 50%; background: currentColor; flex: none; }
  .status-banner.online .dot { animation: pulse 2s ease-in-out infinite; }
  @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.35; } }

  .tap-target {
    width: 210px; height: 210px; border-radius: 50%;
    border: 3px solid rgba(255,255,255,0.18);
    display: flex; align-items: center; justify-content: center;
    margin-bottom: 24px; position: relative;
  }
  .tap-target svg { width: 84px; height: 84px; opacity: 0.55; }
  .tap-target.flash { animation: flashRing 0.6s ease; }
  @keyframes flashRing { 0% { box-shadow: 0 0 0 0 rgba(50,195,108,0.55); } 100% { box-shadow: 0 0 0 26px rgba(50,195,108,0); } }
  .hint { color: rgba(255,255,255,0.55); font-size: 14px; margin-bottom: 28px; max-width: 360px; }

  .manual-entry { display: flex; gap: 8px; width: 100%; max-width: 360px; margin-bottom: 18px; }
  .manual-entry input {
    flex: 1; padding: 12px 14px; border-radius: 10px; border: 1.5px solid var(--line);
    background: rgba(255,255,255,0.06); color: #fff; font-size: 15px; outline: none;
  }
  .manual-entry input:focus { border-color: var(--blue); }
  .manual-entry button {
    padding: 12px 18px; border-radius: 10px; border: none; background: var(--blue);
    color: #fff; font-weight: 700; font-size: 14px; cursor: pointer;
  }

  .log { width: 100%; max-width: 560px; margin-top: 8px; text-align: left; }
  .log-row {
    display: flex; align-items: center; gap: 10px; padding: 9px 12px; border-radius: 10px;
    background: rgba(255,255,255,0.04); margin-bottom: 6px; font-size: 13.5px;
  }
  .log-row .badge { flex: none; font-size: 11px; font-weight: 800; letter-spacing: 0.03em; padding: 2px 7px; border-radius: 6px; }
  .badge.in { background: rgba(50,195,108,0.2); color: var(--green); }
  .badge.out { background: rgba(11,95,255,0.2); color: #7FA8FF; }
  .badge.queued { background: rgba(247,168,27,0.2); color: var(--amber); }
  .badge.failed { background: rgba(229,72,77,0.2); color: var(--red); }
  .badge.ignored { background: rgba(255,255,255,0.12); color: rgba(255,255,255,0.55); }
  .log-row .name { flex: 1; font-weight: 600; }
  .log-row .time { color: rgba(255,255,255,0.4); font-size: 12px; }

  .footer-note { margin-top: 22px; font-size: 12px; color: rgba(255,255,255,0.35); }
  .setup-screen { max-width: 380px; }
  .setup-screen input { width: 100%; padding: 12px 14px; border-radius: 10px; border: 1.5px solid var(--line);
    background: rgba(255,255,255,0.06); color: #fff; font-size: 14px; margin-bottom: 10px; outline: none; }
  .setup-screen button { width: 100%; padding: 12px; border-radius: 10px; border: none; background: var(--blue);
    color: #fff; font-weight: 700; font-size: 14px; cursor: pointer; margin-top: 6px; }
  .setup-screen p { color: rgba(255,255,255,0.5); font-size: 13px; line-height: 1.5; }
</style>
</head>
<body>

<div id="setupScreen" class="setup-screen" style="display:none;">
  <div class="logo">OneTag · Gate Reader Setup</div>
  <p>Enter this device's school and the gate device key once. They're saved on this device — you won't need to enter them again.</p>
  <input id="setupSchoolId" placeholder="School ID (e.g. SCH-A1B2C3)">
  <input id="setupKey" placeholder="Gate device key" type="password">
  <button id="setupSave">Save &amp; start</button>
</div>

<div id="mainScreen" style="display:none; width:100%; display:flex; flex-direction:column; align-items:center;">
  <div class="logo">OneTag Gate Reader</div>
  <div id="statusBanner" class="status-banner offline"><span class="dot"></span><span id="statusText">Starting…</span></div>

  <div id="tapTarget" class="tap-target">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M6 12a6 6 0 0 1 12 0M8.5 12a3.5 3.5 0 0 1 7 0M12 12v.01M4 12a8 8 0 0 1 16 0"/></svg>
  </div>
  <div class="hint" id="hintText">Hold a wristband near the reader, or scan with the attached USB reader.</div>

  <div class="manual-entry">
    <input id="manualInput" placeholder="Or type tag / UID and press Enter" autocomplete="off">
    <button id="manualBtn">Log</button>
  </div>

  <div class="log" id="logList"></div>
  <div class="footer-note" id="footerNote"></div>
</div>

<script>
(function () {
  'use strict';

  // ---------- Config (per-device, saved once) ----------
  const params = new URLSearchParams(location.search);
  let CONFIG = JSON.parse(localStorage.getItem('onetag_gate_config') || 'null');
  if (params.get('school_id') && params.get('key')) {
    CONFIG = { schoolId: params.get('school_id'), key: params.get('key') };
    localStorage.setItem('onetag_gate_config', JSON.stringify(CONFIG));
  }

  const setupScreen = document.getElementById('setupScreen');
  const mainScreen = document.getElementById('mainScreen');

  if (!CONFIG) {
    setupScreen.style.display = 'block';
    document.getElementById('setupSave').onclick = function () {
      const schoolId = document.getElementById('setupSchoolId').value.trim();
      const key = document.getElementById('setupKey').value.trim();
      if (!schoolId || !key) return;
      CONFIG = { schoolId, key };
      localStorage.setItem('onetag_gate_config', JSON.stringify(CONFIG));
      location.reload();
    };
    return;
  }
  setupScreen.style.display = 'none';
  mainScreen.style.display = 'flex';

  // ---------- IndexedDB: queue + roster cache ----------
  const DB_NAME = 'onetag-gate';
  const DB_VERSION = 1;
  let dbPromise = new Promise((resolve, reject) => {
    const req = indexedDB.open(DB_NAME, DB_VERSION);
    req.onupgradeneeded = () => {
      const db = req.result;
      if (!db.objectStoreNames.contains('queue')) {
        db.createObjectStore('queue', { keyPath: 'id', autoIncrement: true });
      }
      if (!db.objectStoreNames.contains('roster')) {
        db.createObjectStore('roster', { keyPath: 'uid' });
      }
    };
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => reject(req.error);
  });

  async function idb(storeName, mode, fn) {
    const db = await dbPromise;
    return new Promise((resolve, reject) => {
      const tx = db.transaction(storeName, mode);
      const store = tx.objectStore(storeName);
      const opResult = fn(store);
      // fn typically returns an IDBRequest (e.g. store.add(...)) — its
      // .result (the generated key, for add()) is only populated once that
      // request succeeds, which happens before tx.oncomplete fires.
      let resolvedValue = opResult;
      if (opResult && typeof opResult === 'object' && 'onsuccess' in opResult) {
        opResult.onsuccess = () => { resolvedValue = opResult.result; };
        opResult.onerror = () => reject(opResult.error);
      }
      tx.oncomplete = () => resolve(resolvedValue);
      tx.onerror = () => reject(tx.error);
    });
  }

  function queueAdd(entry) {
    return idb('queue', 'readwrite', store => store.add(entry));
  }
  function queueAll() {
    return new Promise(async (resolve) => {
      const db = await dbPromise;
      const tx = db.transaction('queue', 'readonly');
      const store = tx.objectStore('queue');
      const items = [];
      store.openCursor().onsuccess = (e) => {
        const cur = e.target.result;
        if (cur) { items.push(cur.value); cur.continue(); } else { resolve(items); }
      };
    });
  }
  function queueRemove(id) {
    return idb('queue', 'readwrite', store => store.delete(id));
  }
  function queueUpdate(entry) {
    return idb('queue', 'readwrite', store => store.put(entry));
  }
  function rosterGet(uid) {
    return new Promise(async (resolve) => {
      const db = await dbPromise;
      const tx = db.transaction('roster', 'readonly');
      const req = tx.objectStore('roster').get(uid);
      req.onsuccess = () => resolve(req.result ? req.result.tagId : null);
      req.onerror = () => resolve(null);
    });
  }
  function rosterPut(uid, tagId) {
    return idb('roster', 'readwrite', store => store.put({ uid, tagId }));
  }
  function rosterBulkPut(pairs) {
    return idb('roster', 'readwrite', store => { pairs.forEach(p => store.put(p)); });
  }

  // ---------- UI helpers ----------
  const statusBanner = document.getElementById('statusBanner');
  const statusText = document.getElementById('statusText');
  const logList = document.getElementById('logList');
  const footerNote = document.getElementById('footerNote');
  const tapTarget = document.getElementById('tapTarget');

  function setOnlineUI(pendingCount) {
    if (navigator.onLine && pendingCount === 0) {
      statusBanner.className = 'status-banner online';
      statusText.textContent = 'Online · all taps synced';
    } else if (navigator.onLine && pendingCount > 0) {
      statusBanner.className = 'status-banner online';
      statusText.textContent = `Online · syncing ${pendingCount} queued tap${pendingCount === 1 ? '' : 's'}…`;
    } else {
      statusBanner.className = 'status-banner offline';
      statusText.textContent = `Offline · ${pendingCount} tap${pendingCount === 1 ? '' : 's'} queued — will sync automatically`;
    }
  }

  function prependLog(name, badge, timeStr) {
    const row = document.createElement('div');
    row.className = 'log-row';
    row.innerHTML = `<span class="badge ${badge.cls}">${badge.label}</span><span class="name">${name}</span><span class="time">${timeStr}</span>`;
    logList.prepend(row);
    while (logList.children.length > 12) logList.removeChild(logList.lastChild);
    return row;
  }

  function flashTap() {
    tapTarget.classList.remove('flash');
    void tapTarget.offsetWidth;
    tapTarget.classList.add('flash');
  }

  // Maps a queue entry's IndexedDB id -> its log row DOM element, so the UI
  // can be updated once a queued tap syncs. Kept in memory only (not
  // persisted) — entries queued in a previous page load simply sync
  // silently without a matching row to update, which is fine since the
  // status banner still reflects the true queued/synced count either way.
  const rowsById = new Map();

  // ---------- Roster prefetch (best-effort, makes offline UID resolution work from the start) ----------
  async function refreshRoster() {
    if (!navigator.onLine) return;
    try {
      const res = await fetch(`/api/gate/roster?school_id=${encodeURIComponent(CONFIG.schoolId)}&key=${encodeURIComponent(CONFIG.key)}`);
      if (!res.ok) return;
      const rows = await res.json();
      await rosterBulkPut(rows.filter(r => r.uid).map(r => ({ uid: r.uid, tagId: r.tag_id })));
      footerNote.textContent = `Roster cached: ${rows.length} tags · last synced ${new Date().toLocaleTimeString()}`;
    } catch (e) { /* offline or unreachable — cached roster from last success still applies */ }
  }

  // ---------- Best-effort geolocation (short timeout — never blocks logging the tap) ----------
  function getPositionBestEffort(timeoutMs) {
    return new Promise((resolve) => {
      if (!navigator.geolocation) return resolve(null);
      const timer = setTimeout(() => resolve(null), timeoutMs);
      navigator.geolocation.getCurrentPosition(
        (pos) => { clearTimeout(timer); resolve({ lat: pos.coords.latitude, lng: pos.coords.longitude }); },
        () => { clearTimeout(timer); resolve(null); },
        { maximumAge: 60000, timeout: timeoutMs }
      );
    });
  }

  // ---------- Resolve a raw UID to a tag_id, using cache first then network ----------
  async function resolveTagId(uid) {
    const cached = await rosterGet(uid);
    if (cached) return cached;
    if (!navigator.onLine) return null;
    try {
      const res = await fetch(`/api/tag/by-uid/${encodeURIComponent(uid)}`);
      if (!res.ok) return null;
      const data = await res.json();
      await rosterPut(uid, data.tag_id);
      return data.tag_id;
    } catch (e) { return null; }
  }

  // ---------- Submit one queue entry to the server ----------
  async function submitEntry(entry) {
    const res = await fetch(`/api/gate/${encodeURIComponent(entry.tagId)}`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        key: CONFIG.key,
        lat: entry.lat, lng: entry.lng,
        client_timestamp: entry.clientTimestamp
      })
    });
    if (!res.ok) throw new Error('http_' + res.status);
    return res.json();
  }

  // ---------- Flush the queue: resolve any unresolved UIDs, then submit ----------
  let flushing = false;
  async function flushQueue() {
    if (flushing) return;
    flushing = true;
    try {
      const items = await queueAll();
      for (const entry of items) {
        if (!entry.tagId) {
          const tagId = await resolveTagId(entry.uid);
          if (!tagId) continue; // still can't resolve — leave queued, try again next flush
          entry.tagId = tagId;
          await queueUpdate(entry);
        }
        if (!navigator.onLine) continue;
        try {
          const result = await submitEntry(entry);
          await queueRemove(entry.id);
          const row = rowsById.get(entry.id);
          if (row) {
            const badge = row.querySelector('.badge');
            badge.className = 'badge ' + (result.ignored ? 'ignored' : (result.direction || 'in'));
            badge.textContent = result.ignored ? 'SKIPPED' : result.direction.toUpperCase();
            rowsById.delete(entry.id);
          }
        } catch (e) {
          entry.attempts = (entry.attempts || 0) + 1;
          await queueUpdate(entry);
        }
      }
    } finally {
      flushing = false;
      const remaining = await queueAll();
      setOnlineUI(remaining.length);
    }
  }

  // ---------- Handle a tap (from NFC or manual entry) ----------
  async function handleTap(rawInput) {
    // Captured immediately, before the (up to 4s) GPS wait below — so the
    // stored time reflects the actual moment of the tap, not whenever
    // geolocation happened to resolve afterward.
    const tapObservedAt = new Date().toISOString();
    flashTap();
    const isLikelyTagId = /^OT-/i.test(rawInput.trim());
    const uid = isLikelyTagId ? null : rawInput.trim().toUpperCase();
    const knownTagId = isLikelyTagId ? rawInput.trim().toUpperCase() : null;

    const pos = await getPositionBestEffort(4000);
    const entry = {
      uid, tagId: knownTagId,
      lat: pos ? pos.lat : null, lng: pos ? pos.lng : null,
      clientTimestamp: tapObservedAt,
      attempts: 0
    };

    if (!entry.tagId && entry.uid) {
      entry.tagId = await resolveTagId(entry.uid);
    }

    const label = entry.tagId || entry.uid || 'Unknown tag';
    const row = prependLog(label, { cls: 'queued', label: 'QUEUED' }, new Date().toLocaleTimeString());

    const id = await queueAdd({ uid: entry.uid, tagId: entry.tagId, lat: entry.lat, lng: entry.lng, clientTimestamp: entry.clientTimestamp, attempts: 0 });
    rowsById.set(id, row);

    const items = await queueAll();
    setOnlineUI(items.length);
    flushQueue();
  }

  // ---------- Manual entry / keyboard-wedge USB NFC reader input ----------
  const manualInput = document.getElementById('manualInput');
  document.getElementById('manualBtn').onclick = submitManual;
  manualInput.addEventListener('keydown', (e) => { if (e.key === 'Enter') submitManual(); });
  function submitManual() {
    const val = manualInput.value.trim();
    if (!val) return;
    manualInput.value = '';
    handleTap(val);
  }
  // Auto-focus so a USB keyboard-wedge NFC reader (which just "types" the UID + Enter)
  // works without staff needing to click into the field first.
  setInterval(() => { if (document.activeElement !== manualInput) manualInput.focus(); }, 2000);
  manualInput.focus();

  // ---------- Web NFC (Chrome for Android) ----------
  document.getElementById('hintText').textContent =
    ('NDEFReader' in window)
      ? 'Hold a wristband near the reader.'
      : 'Scan with the attached USB reader, or type the tag/UID below.';

  if ('NDEFReader' in window) {
    try {
      const reader = new NDEFReader();
      reader.scan().then(() => {
        reader.onreading = (event) => {
          const uid = event.serialNumber ? event.serialNumber.replace(/:/g, '').toUpperCase() : null;
          if (uid) handleTap(uid);
        };
      }).catch(() => { /* permission denied or unsupported — manual/USB entry still works */ });
    } catch (e) { /* Web NFC not actually usable here — fall back silently */ }
  }

  // ---------- Connectivity + periodic sync ----------
  window.addEventListener('online', () => { refreshRoster(); flushQueue(); });
  window.addEventListener('offline', async () => setOnlineUI((await queueAll()).length));
  setInterval(async () => { flushQueue(); }, 20000);
  setInterval(refreshRoster, 15 * 60 * 1000);

  // ---------- Background Sync (best-effort; lets queued taps flush even if the
  // page/device was reloaded while offline and Chrome wakes the service worker
  // briefly on reconnect) ----------
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('/gate-listener-sw.js').then((reg) => {
      if ('sync' in reg) {
        window.addEventListener('online', () => reg.sync.register('onetag-gate-flush').catch(() => {}));
      }
    }).catch(() => {});
    navigator.serviceWorker.addEventListener('message', (e) => {
      if (e.data === 'onetag-gate-flush') flushQueue();
    });
  }

  // ---------- Initial boot ----------
  (async function boot() {
    const items = await queueAll();
    setOnlineUI(items.length);
    await refreshRoster();
    flushQueue();
  })();
})();
</script>
</body>
</html>
