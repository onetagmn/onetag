<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>OneTag — Parent Portal</title>
<link rel="icon" type="image/png" sizes="32x32" href="/assets/favicon-32.png">
<link rel="icon" type="image/png" sizes="16x16" href="/assets/favicon-16.png">
<link rel="apple-touch-icon" href="/assets/apple-touch-icon.png">
<meta name="robots" content="noindex, nofollow">
<style>
  :root {
    --signal: #0B5FFF; --signal-deep: #0A3FBF; --paper: #EEF2FB;
    --ink: #0B1C33; --muted: #4A5A78;
    --card: #FFFFFF; --line: #DCE4F0; --danger: #C1442C; --ok: #16A34A; --out: #B45309; --radius: 14px;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: var(--paper); color: var(--ink); min-height: 100vh;
  }
  .topbar {
    background: var(--signal); color: white; padding: 16px 20px; font-weight: 700;
    display: flex; align-items: center; gap: 10px; font-size: 16px;
  }
  .topbar svg { width: 26px; height: 26px; flex: none; }
  .wrap { max-width: 480px; margin: 0 auto; padding: 24px 18px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); padding: 22px; margin-bottom: 16px; }
  h2 { font-size: 16px; margin: 0 0 12px; color: var(--signal); }
  label { display: block; font-size: 13px; font-weight: 600; margin: 12px 0 5px; color: var(--muted); }
  input { width: 100%; padding: 11px 12px; border: 1px solid var(--line); border-radius: 9px; font-size: 15px; }
  input:focus { outline: none; border-color: var(--signal); }
  .btn { width: 100%; padding: 13px; border: none; border-radius: 10px; background: var(--signal); color: white; font-size: 15px; font-weight: 700; cursor: pointer; margin-top: 14px; }
  .btn:hover { background: var(--signal-deep); }
  .msg { padding: 10px 12px; border-radius: 8px; font-size: 13px; margin-top: 12px; }
  .msg.error { background: #FBE9E5; color: var(--danger); }
  .msg.ok { background: #E1EBFF; color: var(--signal-deep); }
  .child-name { font-size: 17px; font-weight: 800; }
  .log-row { display: flex; justify-content: space-between; padding: 8px 0; border-bottom: 1px solid var(--line); font-size: 13px; }
  .log-row:last-child { border-bottom: none; }
  .tag-in { color: var(--ok); font-weight: 700; }
  .tag-out { color: var(--out); font-weight: 700; }
  .empty { color: #6B7A99; font-size: 13px; }
</style>
</head>
<body>
  <div class="topbar">
    <svg viewBox="0 0 512 512"><path fill="#fff" d="M240.59,431.93C127.07,267.37 106,250.48 106,190C106,107.16 173.16,40 256,40C338.84,40 406,107.16 406,190C406,250.48 384.93,267.37 271.41,431.93C264.0,442.69 248.03,442.69 240.59,431.93Z"/><rect x="200" y="172" rx="12" ry="12" width="32" height="50" fill="#0B5FFF"/><path fill="none" stroke="#0B5FFF" stroke-width="24" stroke-linecap="round" stroke-linejoin="round" d="M256,163 L256,213 M256,213 Q246,240 232,266 M256,213 Q276,238 286,264 M256,172 Q238,190 224,205 M256,172 Q278,188 292,200"/><circle cx="256" cy="138" r="23" fill="#0B5FFF"/><g fill="none" stroke="#fff" stroke-width="13" stroke-linecap="round"><path d="M 411.7 89.9 A 26 26 0 0 1 430.1 108.3"/><path d="M 416.9 70.6 A 46 46 0 0 1 449.4 103.1"/><path d="M 422.1 51.25 A 66 66 0 0 1 468.75 97.9"/></g><circle cx="405" cy="115" r="15" fill="#fff"/></svg>
    OneTag Parent Portal
  </div>
  <div class="wrap" id="app">
    <div class="card">
      <h2>View your child's activity</h2>
      <form id="phoneForm">
        <label>Your phone number (the one on file)</label>
        <input name="phone" required placeholder="99112233">
        <button type="submit" class="btn">Send code</button>
        <div id="phoneMsg"></div>
      </form>
    </div>
  </div>

<script>
const API_BASE = window.location.origin; // auto-detects localhost during dev, onrender.com in production
const app = document.getElementById('app');
function esc(val) {
  if (val === null || val === undefined) return '';
  return String(val)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;').replace(/'/g, '&#039;');
}

// On load, check if this device already has a remembered session — if so,
// skip the phone/OTP form entirely and go straight to the history view.
const rememberedToken = localStorage.getItem('onetag_parent_token');
if (rememberedToken) {
  app.innerHTML = `<div class="card"><p class="empty">Loading...</p></div>`;
  loadHistory(rememberedToken, true);
}

document.getElementById('phoneForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  const phone = e.target.phone.value;
  const msg = document.getElementById('phoneMsg');
  const res = await fetch(`${API_BASE}/api/parent/request-otp`, {
    method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ phone })
  });
  const out = await res.json();
  msg.innerHTML = `<div class="msg ok">${out.message}</div>`;
  renderCodeForm(phone);
});

function renderCodeForm(phone) {
  const card = document.createElement('div');
  card.className = 'card';
  card.innerHTML = `
    <h2>Enter the code</h2>
    <label>6-digit code from your email</label>
    <input id="codeInput" maxlength="6">
    <button class="btn" id="verifyBtn">View history</button>
    <div id="verifyMsg"></div>
  `;
  app.appendChild(card);

  card.querySelector('#verifyBtn').onclick = async () => {
    const code = card.querySelector('#codeInput').value;
    const res = await fetch(`${API_BASE}/api/parent/verify-otp`, {
      method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ phone, code })
    });
    const out = await res.json();
    const msg = card.querySelector('#verifyMsg');
    if (!res.ok) { msg.innerHTML = `<div class="msg error">${out.error}</div>`; return; }
    // Remember this device — the token is valid for 30 days, so the parent
    // won't need to re-enter a code every time they check on their child.
    localStorage.setItem('onetag_parent_token', out.token);
    loadHistory(out.token);
  };
}

async function loadHistory(token, isAutoLogin) {
  const res = await fetch(`${API_BASE}/api/parent/history`, { headers: { 'Authorization': `Bearer ${token}` } });
  if (!res.ok) {
    // Stored token expired or invalid — clear it and fall back to the
    // phone/OTP form rather than showing a dead end.
    localStorage.removeItem('onetag_parent_token');
    if (isAutoLogin) return; // app already shows the phone form by default
    const out = await res.json().catch(() => ({}));
    app.innerHTML = `<div class="card"><p class="msg error">${out.error || 'Session expired — please verify again.'}</p></div>`;
    setTimeout(() => window.location.reload(), 1800);
    return;
  }
  const children = await res.json();
  currentChildren = children;

  app.innerHTML = `
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;gap:10px;flex-wrap:wrap;">
      <div>
        <label style="font-size:12.5px;font-weight:600;color:#6B7A99;margin-right:6px;">Filter by date</label>
        <input id="historyDateFilter" type="date" style="padding:7px 9px;border:1px solid var(--line);border-radius:8px;font-size:13px;">
        <span id="clearDateFilter" style="font-size:12px;color:var(--signal);cursor:pointer;text-decoration:underline;margin-left:6px;display:none;">Clear</span>
      </div>
      <span id="logoutLink" style="font-size:12.5px;color:#6B7A99;cursor:pointer;text-decoration:underline;">Not you? Switch phone number</span>
    </div>
    <div id="childrenList"></div>
  `;
  document.getElementById('logoutLink').onclick = () => {
    localStorage.removeItem('onetag_parent_token');
    window.location.reload();
  };
  document.getElementById('historyDateFilter').addEventListener('input', renderChildren);
  document.getElementById('clearDateFilter').addEventListener('click', () => {
    document.getElementById('historyDateFilter').value = '';
    renderChildren();
  });

  if (!children.length) {
    document.getElementById('childrenList').innerHTML = '<div class="card"><p class="empty">No children found for this phone number.</p></div>';
    return;
  }
  renderChildren();
}

// Extracts a YYYY-MM-DD string in the browser's LOCAL timezone, so the
// date filter matches what's actually shown in each row (also local time).
function localDateStr(value) {
  const dt = new Date(value);
  const y = dt.getFullYear();
  const m = String(dt.getMonth() + 1).padStart(2, '0');
  const d = String(dt.getDate()).padStart(2, '0');
  return `${y}-${m}-${d}`;
}

let currentChildren = [];

function renderChildren() {
  const listEl = document.getElementById('childrenList');
  const dateVal = document.getElementById('historyDateFilter').value;
  document.getElementById('clearDateFilter').style.display = dateVal ? 'inline' : 'none';
  listEl.innerHTML = '';

  currentChildren.forEach(child => {
    const card = document.createElement('div');
    card.className = 'card';
    // Prefer client_timestamp (the real moment the tap happened, captured
    // on the device) over timestamp (when the server received it) — they
    // only differ when a tap was queued offline and synced later.
    const gateLogsFiltered = child.gate_logs.filter(g => !dateVal || localDateStr(g.client_timestamp || g.timestamp) === dateVal);
    const scanLogsFiltered = child.scan_logs.filter(s => !dateVal || localDateStr(s.client_timestamp || s.timestamp) === dateVal);

    const gateRows = gateLogsFiltered.map(g => `
      <div class="log-row">
        <span>${new Date(g.client_timestamp || g.timestamp).toLocaleString()}</span>
        <span class="${g.direction === 'in' ? 'tag-in' : 'tag-out'}">${g.direction.toUpperCase()}</span>
      </div>
    `).join('') || `<p class="empty">${dateVal ? 'No gate activity on this date.' : 'No gate activity yet.'}</p>`;

    const scanRows = scanLogsFiltered.map(s => `
      <div class="log-row">
        <span>${new Date(s.client_timestamp || s.timestamp).toLocaleString()}</span>
        <span>${s.location_lat ? `${s.location_lat.toFixed(4)}, ${s.location_lng.toFixed(4)}` : 'No location'}</span>
      </div>
    `).join('') || `<p class="empty">${dateVal ? 'No scans on this date.' : 'No scans yet.'}</p>`;

    card.innerHTML = `
      <div class="child-name">${esc(child.child_name)}</div>
      <h2 style="margin-top:16px;">Gate activity</h2>
      ${gateRows}
      <h2 style="margin-top:16px;">Wristband scans</h2>
      ${scanRows}
    `;
    listEl.appendChild(card);
  });
}
</script>
</body>
</html>
