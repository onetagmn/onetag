<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- "Signal Blue" mark — solid pin (no hollow ring), child+backpack
       pictogram knocked out in white, monochrome wifi/NFC signal fanning
       from a dot positioned clear of the pin's own silhouette. Replaces
       the earlier navy+gold hollow-ring version. -->

  <!-- PIN, solid fill, single closed cubic-bezier path -->
  <path fill="#0B5FFF" d="
    M240.59,431.93
    C127.07,267.37 106,250.48 106,190
    C106,107.16 173.16,40 256,40
    C338.84,40 406,107.16 406,190
    C406,250.48 384.93,267.37 271.41,431.93
    C264.0,442.69 248.03,442.69 240.59,431.93
    Z
  "/>

  <!-- CHILD + BACKPACK pictogram, white, drawn directly on top of the solid pin -->
  <g>
    <rect x="200" y="172" rx="12" ry="12" width="32" height="50" fill="#fff"/>
    <path fill="none" stroke="#fff" stroke-width="24" stroke-linecap="round" stroke-linejoin="round" d="
      M256,163 L256,213
      M256,213 Q246,240 232,266
      M256,213 Q276,238 286,264
      M256,172 Q238,190 224,205
      M256,172 Q278,188 292,200
    "/>
    <circle cx="256" cy="138" r="23" fill="#fff"/>
  </g>

  <!-- WIFI / NFC SIGNAL — three concentric arcs + dot, centered clear of
       the pin's own silhouette (405,115), monochrome blue -->
  <g fill="none" stroke="#0B5FFF" stroke-width="13" stroke-linecap="round">
    <path d="M 411.7 89.9 A 26 26 0 0 1 430.1 108.3"/>
    <path d="M 416.9 70.6 A 46 46 0 0 1 449.4 103.1"/>
    <path d="M 422.1 51.25 A 66 66 0 0 1 468.75 97.9"/>
  </g>
  <circle cx="405" cy="115" r="15" fill="#0B5FFF"/>
</svg>
