<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>OneTag — Manage Schools & Admins</title>
<style>
  :root {
    --ink: #0E2A32; --steppe: #0F4C5C; --steppe-light: #16687D;
    --sun: #E8A33D; --paper: #FAF8F4; --card: #FFFFFF; --line: #DCE4E6;
    --ok: #2E7D5B; --danger: #C1442C; --radius: 12px;
  }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: var(--paper); color: var(--ink); }
  .topbar { background: var(--steppe); color: white; padding: 16px 24px; display: flex; justify-content: space-between; align-items: center; }
  .topbar h1 { margin: 0; font-size: 18px; }
  .topbar a { color: rgba(255,255,255,0.85); font-size: 13px; text-decoration: none; }
  .wrap { max-width: 800px; margin: 0 auto; padding: 24px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); padding: 22px; margin-bottom: 24px; }
  h2 { font-size: 15px; margin: 0 0 16px; color: var(--steppe); }
  label { display: block; font-size: 13px; font-weight: 600; margin: 10px 0 5px; }
  input, select { width: 100%; padding: 10px 11px; border: 1px solid var(--line); border-radius: 8px; font-size: 14px; }
  .row { display: flex; gap: 10px; }
  .row > div { flex: 1; }
  .btn { padding: 10px 18px; border: none; border-radius: 8px; background: var(--steppe); color: white; font-size: 14px; font-weight: 700; cursor: pointer; margin-top: 14px; }
  .btn.danger { background: var(--danger); padding: 6px 12px; font-size: 12px; margin-top: 0; }
  table { width: 100%; border-collapse: collapse; margin-top: 6px; }
  th, td { text-align: left; padding: 9px 10px; font-size: 13px; border-bottom: 1px solid var(--line); }
  th { color: var(--steppe); font-weight: 700; }
  .badge { font-size: 11px; padding: 3px 8px; border-radius: 20px; font-weight: 700; }
  .badge.active { background: #E4F3EB; color: var(--ok); }
  .badge.pending { background: #FDF0DE; color: #9a6a14; }
  .msg { padding: 10px 12px; border-radius: 8px; font-size: 13px; margin-top: 12px; }
  .msg.error { background: #FBE9E5; color: var(--danger); }
  .msg.ok { background: #E4F3EB; color: var(--ok); }
  .empty { color: #6B7A7D; font-size: 13px; padding: 10px 0; }
</style>
</head>
<body>
  <div class="topbar">
    <h1>OneTag — Manage Schools & Admins</h1>
    <a href="dashboard.html">← Back to dashboard</a>
  </div>
  <div class="wrap">

    <div class="card">
      <h2>Add a school</h2>
      <form id="schoolForm">
        <label>School name</label>
        <input name="name" required placeholder="e.g. Ikh Urgoo Special Needs School">
        <button type="submit" class="btn">Create school</button>
        <div id="schoolMsg"></div>
      </form>
    </div>

    <div class="card">
      <h2>Invite a school admin</h2>
      <form id="adminForm">
        <div class="row">
          <div>
            <label>Username</label>
            <input name="username" required>
          </div>
          <div>
            <label>Email (setup code goes here)</label>
            <input name="email" type="email" required>
          </div>
        </div>
        <label>School</label>
        <select name="school_id" id="schoolSelect" required></select>
        <button type="submit" class="btn">Send invite</button>
        <div id="adminMsg"></div>
      </form>
    </div>

    <div class="card">
      <h2>All admin accounts</h2>
      <div id="adminsTable">Loading...</div>
    </div>

  </div>

<script>
const API_BASE = window.location.origin; // auto-detects localhost during dev, onrender.com in production
const token = localStorage.getItem('onetag_admin_token');
if (!token) window.location.href = 'admin-login.html';
function esc(val) {
  if (val === null || val === undefined) return '';
  return String(val)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;').replace(/'/g, '&#039;');
}

async function authFetch(path, options = {}) {
  const res = await fetch(`${API_BASE}${path}`, {
    ...options,
    headers: { ...(options.headers || {}), 'Authorization': `Bearer ${token}` }
  });
  if (res.status === 401) {
    localStorage.removeItem('onetag_admin_token');
    window.location.href = 'admin-login.html';
    throw new Error('Session expired');
  }
  return res;
}

async function loadSchoolsIntoSelect() {
  const res = await authFetch('/api/admin/schools');
  const schools = await res.json();
  const select = document.getElementById('schoolSelect');
  select.innerHTML = schools.map(s => `<option value="${esc(s.school_id)}">${esc(s.name)}</option>`).join('');
}

async function loadAdmins() {
  const container = document.getElementById('adminsTable');
  const res = await authFetch('/api/admin/admins');
  const admins = await res.json();
  if (!admins.length) {
    container.innerHTML = '<div class="empty">No admin accounts yet.</div>';
    return;
  }
  container.innerHTML = `
    <table>
      <thead><tr><th>Username</th><th>Email</th><th>Role</th><th>School</th><th>Status</th><th></th></tr></thead>
      <tbody>
        ${admins.map(a => `
          <tr>
            <td>${esc(a.username)}</td>
            <td>${esc(a.email)}</td>
            <td>${a.role === 'super_admin' ? 'Super admin' : 'School admin'}</td>
            <td>${a.school_name ? esc(a.school_name) : '—'}</td>
            <td><span class="badge ${a.status}">${a.status}</span></td>
            <td>${a.role === 'super_admin' ? '' : `<button class="btn danger" data-id="${a.admin_id}">Delete</button>`}</td>
          </tr>
        `).join('')}
      </tbody>
    </table>
  `;
  container.querySelectorAll('.btn.danger').forEach(btn => {
    btn.onclick = async () => {
      if (!confirm('Delete this admin account? This cannot be undone.')) return;
      await authFetch(`/api/admin/admins/${btn.dataset.id}`, { method: 'DELETE' });
      loadAdmins();
    };
  });
}

document.getElementById('schoolForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  const f = e.target;
  const msg = document.getElementById('schoolMsg');
  const res = await authFetch('/api/admin/schools', {
    method: 'POST', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ name: f.name.value })
  });
  const out = await res.json();
  if (!res.ok) { msg.innerHTML = `<div class="msg error">${out.error}</div>`; return; }
  msg.innerHTML = `<div class="msg ok">Created "${out.name}".</div>`;
  f.reset();
  loadSchoolsIntoSelect();
});

document.getElementById('adminForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  const f = e.target;
  const msg = document.getElementById('adminMsg');
  const res = await authFetch('/api/admin/admins/invite', {
    method: 'POST', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ username: f.username.value, email: f.email.value, school_id: f.school_id.value })
  });
  const out = await res.json();
  if (!res.ok) { msg.innerHTML = `<div class="msg error">${out.error}</div>`; return; }
  msg.innerHTML = `<div class="msg ok">Invite sent — they'll get a setup code by email.</div>`;
  f.reset();
  loadAdmins();
});

loadSchoolsIntoSelect();
loadAdmins();
</script>
</body>
</html>
