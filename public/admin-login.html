<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>OneTag — Admin Login</title>
<style>
  :root {
    --ink: #0E2A32; --steppe: #0F4C5C; --steppe-light: #16687D;
    --sun: #E8A33D; --paper: #FAF8F4; --card: #FFFFFF; --line: #DCE4E6;
    --danger: #C1442C; --radius: 14px;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: var(--paper); color: var(--ink);
    min-height: 100vh; display: flex; align-items: center; justify-content: center;
  }
  .card {
    background: var(--card); border: 1px solid var(--line); border-radius: var(--radius);
    padding: 32px; width: 100%; max-width: 380px;
  }
  .mark { display: flex; align-items: center; gap: 10px; margin-bottom: 24px; }
  .mark-icon {
    width: 32px; height: 32px; border-radius: 8px; background: var(--sun);
    display: flex; align-items: center; justify-content: center;
    font-weight: 800; color: var(--steppe); font-size: 14px;
  }
  h1 { font-size: 18px; margin: 0; }
  label { display: block; font-size: 13px; font-weight: 600; margin: 14px 0 6px; }
  input {
    width: 100%; padding: 11px 12px; border: 1px solid var(--line); border-radius: 9px; font-size: 15px;
  }
  .btn {
    width: 100%; padding: 13px; border: none; border-radius: 10px; background: var(--steppe);
    color: white; font-size: 15px; font-weight: 700; cursor: pointer; margin-top: 20px;
  }
  .msg { padding: 10px 12px; border-radius: 8px; font-size: 13px; margin-top: 14px; }
  .msg.error { background: #FBE9E5; color: var(--danger); }
</style>
</head>
<body>
  <div class="card">
    <div class="mark">
      <div class="mark-icon">OT</div>
      <h1>OneTag Admin</h1>
    </div>
    <form id="loginForm">
      <label>Username</label>
      <input name="username" required autocomplete="username">
      <label>Password</label>
      <input name="password" type="password" required autocomplete="current-password">
      <button type="submit" class="btn">Log in</button>
      <div id="msg"></div>
    </form>
  </div>

<script>
const API_BASE = 'http://localhost:3000'; // change to your real Render URL for production

document.getElementById('loginForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  const f = e.target;
  const msg = document.getElementById('msg');
  msg.innerHTML = '';

  const res = await fetch(`${API_BASE}/api/admin/login`, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ username: f.username.value, password: f.password.value })
  });
  const out = await res.json();
  if (!res.ok) {
    msg.innerHTML = `<div class="msg error">${out.error}</div>`;
    return;
  }

  localStorage.setItem('onetag_admin_token', out.token);
  localStorage.setItem('onetag_admin_info', JSON.stringify(out.admin));
  window.location.href = 'dashboard.html';
});
</script>
</body>
</html>
